# Canonical docs + last-checked release version for the libraries this skill recommends.
#
# `.github/scripts/check_cloud_native_geo_freshness.py` reads this file weekly, compares
# `last_recorded_version` against the live registry, and opens/updates a GitHub issue when
# something has shipped a newer release — it does not edit this file or the skill content
# itself. After reviewing a flagged package, update its `last_recorded_version` and
# `last_checked` by hand as part of the PR that updates the prose.
#
# `registry` must be one of: pypi, npm, github-tags. Entries without a clean, checkable
# release stream (specs, bundle repos versioned by other means) are intentionally left out
# of this file — they're still referenced in SKILL.md / references/*.md, just not
# version-diffed automatically.

